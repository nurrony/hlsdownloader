pre-commit:
  parallel: false
  jobs:
    - name: Validate Types
      run: pnpm typecheck

    - name: Lint and Fix Coding Style (Staged files)
      stage_fixed: true
      exclude:
        - 'docs/**/*'
        - 'dist/**/*'
        - 'coverage/**/*'
        - 'node_modules/**/*'
        - 'pnpm-lock.yaml'
      glob:
        - '*.ts'
        - '**/*.ts'
        - '*.json'
      run: pnpm exec eslint --fix {staged_files}

    - name: Format Code
      stage_fixed: true
      glob:
        - '*.{ts,js,json,md}'
        - '**/*.{ts,js,json,md}'
      exclude:
        - 'dist/**/*'
        - 'pnpm-lock.yaml'
        - 'coverage/**/*'
        - 'node_modules/**/*'
      run: pnpm exec prettier --write {staged_files}

    - name: 'Running Unit Tests'
      run: pnpm test:coverage
      stage_fixed: true

prepare-commit-msg:
  jobs:
    - name: 'Prepare Conventional Commit Message'
      interactive: true
      env:
        LEFTHOOK: '0'
      skip:
        - merge
        - rebase
      run: |
        echo "⏳ Opening Conventional Commit Prompt..."
        pnpm exec cz --hook

commit-msg:
  jobs:
    - name: 'Lint Commit Message'
      skip:
        - merge
        - rebase
      run: |
        pnpm exec commitlint --edit {1}
        echo '🔖 Commit message guidelines are followed properly.'

output:
  - summary
  - success
  - failure
  - execution_out
