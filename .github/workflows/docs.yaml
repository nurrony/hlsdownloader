name: Publish Documentation

on:
  workflow_run:
    workflows: ["Release to NPM"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CI: true

jobs:
  publish-docs:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Get latest npm version
        id: npm-version
        run: |
          VERSION="$(pnpm view hlsdownloader version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest npm version: $VERSION"

      - name: Checkout released version
        uses: actions/checkout@v7
        with:
          ref: "v${{ steps.npm-version.outputs.version }}"
          fetch-depth: 0

      - name: Version Check
        run: |
          node -v
          pnpm -v
          echo "Documentation version: ${{ steps.npm-version.outputs.version }}"

      - name: Sync package version
        run: |
          pnpm pkg set version="${{ steps.npm-version.outputs.version }}"
          grep '"version"' package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate documentation
        run: pnpm run docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
